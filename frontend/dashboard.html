<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Abdalla Eissa for Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <div class="logo-icon">🎨</div>
      <span>Abdalla Eissa <span class="accent">for Design</span></span>
    </a>
    <div class="nav-actions" id="navActions">
      <a href="auth.html?tab=login" class="btn btn-ghost btn-sm">Log In</a>
      <a href="auth.html?tab=signup" class="btn btn-primary btn-sm">Sign Up Free</a>
    </div>
  </div>
</nav>

<div class="page-wrapper">
  <div style="max-width:900px;margin:0 auto;padding:3rem 2rem 5rem;">
    <div id="dashboardContent">
      <div class="loading-overlay"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<div id="toastContainer" class="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  await initAuth();
  if (!currentUser) { window.location.href = 'auth.html?tab=login&back=dashboard.html'; return; }
  renderDashboard();
});

function renderDashboard() {
  const p = currentProfile;
  const premium = isPremium();
  const name = p?.full_name || currentUser.email.split('@')[0];
  const expiresAt = p?.subscription_expires_at
    ? new Date(p.subscription_expires_at).toLocaleDateString()
    : null;

  document.getElementById('dashboardContent').innerHTML = `
    <div style="display:flex;align-items:center;gap:1rem;margin-bottom:2.5rem;flex-wrap:wrap;">
      <div class="nav-avatar" style="width:56px;height:56px;font-size:1.5rem;">${name.charAt(0).toUpperCase()}</div>
      <div>
        <h1 style="font-size:1.5rem;font-weight:700;color:var(--white);">Welcome, ${escapeHtml(name)}</h1>
        <p style="color:var(--text-muted);font-size:0.875rem;">${escapeHtml(currentUser.email)}</p>
      </div>
      <div style="margin-left:auto;">
        ${premium ? '<span class="badge-premium" style="font-size:0.8rem;padding:5px 14px;"><i class="fa-solid fa-crown"></i> Premium</span>' : '<span class="badge-free" style="font-size:0.8rem;padding:5px 14px;">Free Plan</span>'}
      </div>
    </div>

    <!-- Plan info -->
    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-xl);padding:2rem;margin-bottom:1.5rem;">
      <h2 style="font-size:1rem;font-weight:700;color:var(--white);margin-bottom:1.5rem;display:flex;align-items:center;gap:0.5rem;">
        <i class="fa-solid fa-id-card" style="color:var(--blue-400);"></i> Subscription
      </h2>
      ${premium ? `
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem;">
          <div class="stat-card">
            <div class="stat-icon"><i class="fa-solid fa-crown"></i></div>
            <span class="stat-value" style="font-size:1.1rem;">Premium</span>
            <span class="stat-label">Current Plan</span>
          </div>
          ${expiresAt ? `<div class="stat-card">
            <div class="stat-icon"><i class="fa-regular fa-calendar"></i></div>
            <span class="stat-value" style="font-size:1rem;">${expiresAt}</span>
            <span class="stat-label">Expires</span>
          </div>` : ''}
          <div class="stat-card">
            <div class="stat-icon"><i class="fa-solid fa-infinity"></i></div>
            <span class="stat-value" style="font-size:1rem;">Unlimited</span>
            <span class="stat-label">Prompt Access</span>
          </div>
        </div>
        <div style="margin-top:1.25rem;">
          <button onclick="handleCancelSub()" class="btn btn-danger btn-sm">
            <i class="fa-solid fa-ban"></i> Cancel Subscription
          </button>
        </div>
      ` : `
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;">
          <div>
            <p style="color:var(--text-secondary);font-size:0.9rem;">You're on the <strong>Free</strong> plan.</p>
            <p style="color:var(--text-muted);font-size:0.82rem;margin-top:0.25rem;">Upgrade to access all 500+ prompts and premium styles.</p>
          </div>
          <a href="pricing.html" class="btn btn-primary">
            <i class="fa-solid fa-crown"></i> Upgrade to Premium
          </a>
        </div>
      `}
    </div>

    <!-- Quick links -->
    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-xl);padding:2rem;">
      <h2 style="font-size:1rem;font-weight:700;color:var(--white);margin-bottom:1.25rem;display:flex;align-items:center;gap:0.5rem;">
        <i class="fa-solid fa-bolt" style="color:var(--blue-400);"></i> Quick Actions
      </h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0.75rem;">
        <a href="index.html" class="btn btn-outline" style="justify-content:flex-start;gap:0.75rem;">
          <i class="fa-solid fa-grid-2"></i> Browse Categories
        </a>
        <a href="pricing.html" class="btn btn-outline" style="justify-content:flex-start;gap:0.75rem;">
          <i class="fa-solid fa-crown"></i> View Plans
        </a>
        <button onclick="signOut()" class="btn btn-ghost" style="justify-content:flex-start;gap:0.75rem;">
          <i class="fa-solid fa-right-from-bracket"></i> Sign Out
        </button>
      </div>
    </div>
  `;
}

async function handleCancelSub() {
  if (!confirm('Are you sure you want to cancel your subscription? You will keep access until the end of your billing period.')) return;
  showToast('To cancel, please contact support or manage via Paymob.', 'info');
}
</script>
</body>
</html>
