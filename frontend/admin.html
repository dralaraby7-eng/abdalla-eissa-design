<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | Abdalla Eissa for Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <div class="logo-icon">🎨</div>
      <span>Abdalla Eissa <span class="accent">for Design</span> <span style="color:#f87171;font-size:0.75rem;margin-left:4px;">ADMIN</span></span>
    </a>
    <div class="nav-actions" id="navActions"></div>
  </div>
</nav>

<div class="page-wrapper">
  <div style="max-width:1100px;margin:0 auto;padding:3rem 2rem 5rem;" id="adminContent">
    <div class="loading-overlay"><div class="spinner"></div></div>
  </div>
</div>

<!-- Add Style Modal -->
<div class="modal-overlay" id="addStyleModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Add New Style</h3>
      <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form id="styleForm" onsubmit="handleSaveStyle(event)">
      <input type="hidden" id="editStyleId">
      <div class="form-group">
        <label class="form-label">Category</label>
        <select class="form-input" id="styleCategory" required></select>
      </div>
      <div class="form-group">
        <label class="form-label">Title</label>
        <input type="text" class="form-input" id="styleTitle" placeholder="e.g. Modern Food Photography" required>
      </div>
      <div class="form-group">
        <label class="form-label">Description (optional)</label>
        <textarea class="form-input" id="styleDesc" placeholder="Brief description of this style" rows="2"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Image URL</label>
        <input type="url" class="form-input" id="styleImageUrl" placeholder="https://…" required>
        <div style="font-size:0.75rem;color:var(--text-muted);margin-top:0.3rem;">Upload to Supabase Storage first, then paste the public URL here.</div>
      </div>
      <div class="form-group">
        <label class="form-label">Meta Prompt <span style="color:#f87171;">*</span></label>
        <textarea class="form-input" id="stylePrompt" placeholder="Write the full AI meta prompt here. Use [PLACEHOLDER] for client-specific fields." rows="7" required></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Tags (comma separated)</label>
        <input type="text" class="form-input" id="styleTags" placeholder="food, modern, photography, dark">
      </div>
      <div class="form-group">
        <div class="toggle-wrap">
          <label class="toggle">
            <input type="checkbox" id="styleIsPremium">
            <span class="toggle-slider"></span>
          </label>
          <span class="form-label" style="margin:0;">Premium style (members only)</span>
        </div>
      </div>
      <div style="display:flex;gap:0.75rem;justify-content:flex-end;margin-top:1rem;">
        <button type="button" onclick="closeModal()" class="btn btn-ghost">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveStyleBtn">
          <i class="fa-solid fa-floppy-disk"></i> Save Style
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Create User Modal -->
<div class="modal-overlay" id="createUserModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Create New User</h3>
      <button class="modal-close" onclick="closeCreateUserModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="alert alert-error" id="createUserError" style="margin-bottom:1rem;">
      <i class="fa-solid fa-circle-xmark"></i>
      <span id="createUserErrorMsg"></span>
    </div>
    <form id="createUserForm" onsubmit="handleCreateUser(event)">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <div class="form-input-icon">
          <i class="fa-regular fa-user"></i>
          <input type="text" class="form-input" id="newUserName" placeholder="User's full name" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="form-input-icon">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" class="form-input" id="newUserEmail" placeholder="user@example.com" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="form-input-icon">
          <i class="fa-solid fa-lock"></i>
          <input type="password" class="form-input" id="newUserPassword" placeholder="Minimum 8 characters" minlength="8" required>
        </div>
      </div>
      <div class="form-group">
        <div class="toggle-wrap">
          <label class="toggle">
            <input type="checkbox" id="newUserPremium">
            <span class="toggle-slider"></span>
          </label>
          <span class="form-label" style="margin:0;">Grant Lifetime Premium immediately</span>
        </div>
      </div>
      <div style="display:flex;gap:0.75rem;justify-content:flex-end;margin-top:1rem;">
        <button type="button" onclick="closeCreateUserModal()" class="btn btn-ghost">Cancel</button>
        <button type="submit" class="btn btn-primary" id="createUserBtn">
          <i class="fa-solid fa-user-plus"></i> <span id="createUserBtnText">Create User</span>
          <span id="createUserSpinner" class="spinner" style="display:none;width:16px;height:16px;border-width:2px;"></span>
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Add Category Modal -->
<div class="modal-overlay" id="addCatModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="catModalTitle">Add Category</h3>
      <button class="modal-close" onclick="closeCatModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form id="catForm" onsubmit="handleSaveCategory(event)">
      <input type="hidden" id="editCatId">
      <div class="form-group">
        <label class="form-label">Name</label>
        <input type="text" class="form-input" id="catName" placeholder="Food & Restaurants" required>
      </div>
      <div class="form-group">
        <label class="form-label">Slug (URL-safe)</label>
        <input type="text" class="form-input" id="catSlug" placeholder="food" required pattern="[a-z0-9-]+">
      </div>
      <div class="form-group">
        <label class="form-label">Icon (emoji)</label>
        <input type="text" class="form-input" id="catIcon" placeholder="🍕" maxlength="4">
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea class="form-input" id="catDesc" rows="2" placeholder="Short description"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Display Order</label>
        <input type="number" class="form-input" id="catOrder" value="0" min="0">
      </div>
      <div style="display:flex;gap:0.75rem;justify-content:flex-end;margin-top:1rem;">
        <button type="button" onclick="closeCatModal()" class="btn btn-ghost">Cancel</button>
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save</button>
      </div>
    </form>
  </div>
</div>

<div id="toastContainer" class="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=6"></script>
<script src="js/auth.js?v=6"></script>
<script src="js/admin.js?v=6"></script>
</body>
</html>
